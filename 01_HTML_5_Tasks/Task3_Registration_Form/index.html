<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HTML Task 3 - Registration</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Student Registration</h1><form onsubmit="event.preventDefault(); alert('Registration submitted');">
<label>Full Name <input required name="name"></label><label>Email <input required type="email" name="email"></label><label>Phone <input required pattern="[0-9]{10}" name="phone"></label>
<label>Date of Birth <input type="date" name="dob"></label><label>Course <select name="course"><option>BCS</option><option>BCA</option></select></label>
<fieldset><legend>Gender</legend><label><input type="radio" name="gender" value="Male"> Male</label><label><input type="radio" name="gender" value="Female"> Female</label></fieldset>
<label>Subjects <select multiple><option>HTML</option><option>CSS</option><option>JavaScript</option><option>Python</option></select></label>
<label>Address <textarea rows="4"></textarea></label><label><input type="checkbox" required> I agree</label><button>Submit</button></form></main></body></html>
